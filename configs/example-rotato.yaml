  - id: "3d-z-lights"
    template: "rotato-3d"
    title:
      text: "Smart Home"
    subtitle:
      text: "Control your devices"
    device:
      mode: "rotato-cli"
      source: "iPhone 17 Pro Max-Lights.png"
      rotato_file: "../../rotated_z.rotato"
      width: 0
      height: 2000
      x: 0
      y: 500

  # ============================================================
  # Mode 2: rotato-template
  # ============================================================
  # Uses a pre-exported Rotato frame as a PNG template:
  # - Template is a PNG with transparent screen area
  # - Screenshot is composited into the template_rect area
  # - Template frame is overlaid on top
  #
  # How to create a template:
  # 1. Open your scene in Rotato
  # 2. Set device screen to a solid color (e.g., green)
  # 3. Export as PNG with transparency
  # 4. In image editor, make the screen area transparent
  # 5. Note the screen rectangle coordinates [x, y, width, height]
  #
  # This mode is faster and works without Rotato running.
  #
  # - id: "3d-template-example"
  #   template: "rotato-3d"
  #   title:
  #     text: "Template Mode"
  #   subtitle:
  #     text: "Pre-rendered frame"
  #   device:
  #     mode: "rotato-template"
  #     source: "iPhone 17 Pro Max-Publish.png"
  #     template: "frames/iphone-rotated-frame.png"
  #     template_rect: [185, 520, 720, 1560]  # x, y, width, height of screen area
  #     width: 0
  #     height: 2000
  #     x: 0
  #     y: 500

outputs:
  - device: "iphone-6.9"
    screens:
      # Left rotation
      - "3d-left-tree"
      - "3d-left-json"
      # Right rotation
      - "3d-right-publish"
      - "3d-right-brokers"
      # Z-axis rotation
      - "3d-z-tree"
      - "3d-z-flat"
      - "3d-z-json"
      - "3d-z-details"
      - "3d-z-publish"
      - "3d-z-brokers"
      - "3d-z-config"
      - "3d-z-context"
      - "3d-z-lights"
    prefix: "rotato"

# ============================================================
# Usage
# ============================================================
#
# To use rotato-cli mode:
#   1. Make sure Rotato is installed
#   2. Run: ./imagegen -config configs/example-rotato.yaml -output ./rotato-output
#   3. Rotato will open, inject screenshots, and export renders
#
# To use rotato-template mode:
#   1. Export your Rotato scene as a PNG template (see instructions above)
#   2. Uncomment the template example screen
#   3. Adjust template_rect to match your template's screen area
#   4. Run: ./imagegen -config configs/example-rotato.yaml -output ./rotato-output
