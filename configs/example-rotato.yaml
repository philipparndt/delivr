# Example configuration demonstrating device template integration
#
# Device templates are pre-rendered frame sets (frame PNG + mask PNG + metadata JSON)
# generated from Rotato .rotato files using:
#
#   delivr rotato --input ./rotato-files --output ./frames
#
# Each template set provides a device bezel with a transparent screen region.
# Screenshots are composited into the screen area using perspective warp
# or rectangle blit, depending on the template geometry.

settings:
  fonts_dir: "/Library/Fonts"
  screenshots_dir: "../../screenshots/dark"

devices:
  # iPhone 17 Pro Max - 6.9-inch display
  iphone-6.9:
    name: "iPhone 6.9-inch"
    width: 1320
    height: 2868
    screenshot_prefix: "iPhone 17 Pro Max"

  # iPhone 17 Pro - 6.3-inch display
  iphone-6.3:
    name: "iPhone 6.3-inch"
    width: 1206
    height: 2622
    screenshot_prefix: "iPhone 17 Pro"

templates:
  rotato-3d:
    title:
      font: "SF-Pro-Display-Bold.otf"
      size: 100
      color: "#FFFFFF"
      align: "center"
      y: 150
    subtitle:
      font: "SF-Pro-Display-Regular.otf"
      size: 48
      color: "#FFFFFFCC"
      align: "center"
      y: 240
    background:
      type: "gradient"
      angle: 180
      stops:
        - pos: 0.0
          color: "#1a1a2e"
        - pos: 1.0
          color: "#16213e"

screens:
  # Left rotation — uses pre-generated template from iPhone17_rotated_left.rotato
  - id: "3d-left-tree"
    template: "rotato-3d"
    title:
      text: "Tree Navigation"
    subtitle:
      text: "Browse your MQTT topics"
    device:
      source: "iPhone 17 Pro Max-Tree View.png"
      template: "frames/iPhone17_rotated_left.frame.json"
      height: 2000
      y: 500
      auto_crop: true

  - id: "3d-left-json"
    template: "rotato-3d"
    title:
      text: "JSON Viewer"
    subtitle:
      text: "Inspect message payloads"
    device:
      source: "iPhone 17 Pro Max-JSON Data.png"
      template: "frames/iPhone17_rotated_left.frame.json"
      height: 2000
      y: 500
      auto_crop: true

  # Right rotation — uses pre-generated template from iPhone17_rotated_right.rotato
  - id: "3d-right-publish"
    template: "rotato-3d"
    title:
      text: "Publish Messages"
    subtitle:
      text: "Send MQTT messages easily"
    device:
      source: "iPhone 17 Pro Max-Publish.png"
      template: "frames/iPhone17_rotated_right.frame.json"
      height: 2000
      y: 500
      auto_crop: true

  - id: "3d-right-brokers"
    template: "rotato-3d"
    title:
      text: "Multiple Brokers"
    subtitle:
      text: "Manage all your connections"
    device:
      source: "iPhone 17 Pro Max-Brokers.png"
      template: "frames/iPhone17_rotated_right.frame.json"
      height: 2000
      y: 500
      auto_crop: true

outputs:
  - device: "iphone-6.9"
    screens:
      - "3d-left-tree"
      - "3d-left-json"
      - "3d-right-publish"
      - "3d-right-brokers"
    prefix: "rotato"

# Workflow:
#   1. Generate templates: delivr rotato --input ./rotato-files --output ./frames
#   2. Generate screenshots: delivr generate --config configs/example-rotato.yaml --output ./output
